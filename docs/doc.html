<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusLink — Documentation</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #0A1128; --paper: #ffffff; --paper-2: #f5f7fb;
    --fg: #1f2430; --muted: #5b6472; --line: #e2e6ee;
    --blue: #0047AB; --blue-lit: #3B82F6; --red: #E31837;
    --code-bg: #0d1424; --code-fg: #dbe4f5;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--fg); font: 16px/1.72 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  nav { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.86); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  nav .row { max-width: 900px; margin: 0 auto; padding: 0 28px; height: 62px; display: flex; align-items: center; gap: 24px; }
  nav img { width: 28px; height: 28px; }
  nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); margin-right: auto; letter-spacing: -0.02em; }
  nav a.link { color: var(--muted); font-size: 0.93rem; }
  main { max-width: 900px; margin: 0 auto; padding: 52px 28px 96px; }
  h1 { font-size: 2.4rem; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 22px; line-height: 1.15; }
  h2 { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.02em; margin: 46px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  h3 { font-size: 1.12rem; font-weight: 600; margin: 30px 0 8px; }
  h4 { font-size: 1rem; font-weight: 600; margin: 22px 0 6px; }
  p, li { max-width: 76ch; }
  ul, ol { padding-left: 24px; }
  li { margin: 4px 0; }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--paper-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  pre { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: 18px 20px; overflow-x: auto; line-height: 1.6; }
  pre code { background: none; border: 0; padding: 0; color: inherit; font-size: 0.86em; }
  blockquote { margin: 20px 0; padding: 6px 0 6px 18px; border-left: 3px solid var(--blue-lit); color: var(--muted); }
  blockquote p { margin: 6px 0; }
  table { border-collapse: collapse; width: 100%; margin: 20px 0; display: block; overflow-x: auto; }
  th, td { border-bottom: 1px solid var(--line); padding: 9px 14px; text-align: left; vertical-align: top; }
  th { font-size: 0.8rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--paper-2); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 38px 0; }
  img { max-width: 100%; }
  .crumb { color: var(--muted); font-size: 0.86rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; }
  .oops { border-left: 3px solid var(--red); padding: 10px 0 10px 18px; color: var(--muted); }
  footer { border-top: 1px solid var(--line); margin-top: 70px; padding-top: 24px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<nav><div class="row">
  <a class="brand" href="index.html"><img src="assets/nexuslink-mark.svg" alt="">NexusLink</a>
  <a class="link" href="index.html">Home</a>
  <a class="link" href="doc.html?d=README.md">Docs</a>
  <a class="link" href="javadoc/index.html">Javadoc</a>
</div></nav>
<main>
  <p class="crumb" id="crumb">Documentation</p>
  <div id="body"><p>Loading…</p></div>
  <footer>NexusLink — offline-first connectivity workbench.</footer>
</main>

<script>
(function () {
  // Only these documents are served through the viewer — no arbitrary paths.
  var DOCS = {
    'README.md':        'Documentation index',
    'ARCHITECTURE.md':  'Architecture',
    'CHANGELOG.md':     'Changelog',
    'CONTRIBUTING.md':  'Contributing',
    'DISTRIBUTION.md':  'Distribution',
    'PACKAGING.md':     'Packaging',
    'PIPELINE.md':      'Pipeline handover',
    'RUN.md':           'Running from source'
  };

  var name = new URLSearchParams(location.search).get('d') || 'README.md';
  if (!Object.prototype.hasOwnProperty.call(DOCS, name)) name = 'README.md';
  document.getElementById('crumb').textContent = DOCS[name];
  document.title = 'NexusLink — ' + DOCS[name];

  fetch(name, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
    .then(function (md) { document.getElementById('body').innerHTML = render(md); rewriteLinks(); })
    .catch(function (e) {
      document.getElementById('body').innerHTML =
        '<p class="oops">Could not load <code>' + esc(name) + '</code> (' + esc(e.message) +
        '). The file sits next to this page in the repository.</p>';
    });

  /** Points in-repository markdown links at the viewer instead of the raw file. */
  function rewriteLinks() {
    document.querySelectorAll('#body a[href$=".md"]').forEach(function (a) {
      var href = a.getAttribute('href').replace(/^\.\//, '');
      if (Object.prototype.hasOwnProperty.call(DOCS, href)) a.setAttribute('href', 'doc.html?d=' + href);
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /** Inline markdown: code spans first (they win over every other mark), then images, links, emphasis. */
  function inline(s) {
    var spans = [];
    s = esc(s).replace(/`([^`]+)`/g, function (_, code) {
      return '@@NLCODE' + (spans.push('<code>' + code + '</code>') - 1) + '@@';
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
    return s.replace(/@@NLCODE(\d+)@@/g, function (_, i) { return spans[Number(i)]; });
  }

  function cells(line) {
    return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
  }

  function render(md) {
    var lines = md.replace(/\r\n?/g, '\n').split('\n');
    var out = [], listStack = [], i = 0;

    function closeList() { while (listStack.length) out.push('</' + listStack.pop() + '>'); }

    while (i < lines.length) {
      var line = lines[i];

      var fence = line.match(/^\s*```+\s*[\w-]*\s*$/);
      if (fence) {
        closeList();
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```+\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      // a table is a header row followed by a |---|---| separator
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
        closeList();
        var head = cells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push('<table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
                 '</tr></thead><tbody>' +
                 rows.map(function (r) {
                   return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
                 }).join('') + '</tbody></table>');
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }

      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { closeList(); out.push('<hr>'); i++; continue; }

      if (/^\s*>\s?/.test(line)) {
        closeList();
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
        continue;
      }

      var li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (li) {
        var wanted = /^\d/.test(li[2]) ? 'ol' : 'ul';
        var depth = Math.floor(li[1].length / 2) + 1;
        while (listStack.length > depth) out.push('</' + listStack.pop() + '>');
        while (listStack.length < depth) { out.push('<' + wanted + '>'); listStack.push(wanted); }
        var item = [li[3]];
        i++;
        // wrapped continuation lines belong to the item, not to a new paragraph
        while (i < lines.length && lines[i].trim() &&
               !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+[.)]\s)/.test(lines[i])) {
          item.push(lines[i++].trim());
        }
        out.push('<li>' + inline(item.join(' ')) + '</li>');
        continue;
      }

      if (!line.trim()) { closeList(); i++; continue; }

      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+[.)]\s)/.test(lines[i])) {
        para.push(lines[i++]);
      }
      if (para.length) { closeList(); out.push('<p>' + inline(para.join(' ')) + '</p>'); }
      else i++;
    }
    closeList();
    return out.join('\n');
  }
})();
</script>
</body>
</html>
