<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NexusLink">
  <title>NexusLink</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1A38"/>
      <stop offset="1" stop-color="#060B18"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="160" y1="250" x2="352" y2="396">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0047AB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- the canopy: one console over everything below it -->
  <path d="M 116 196 C 178 100 334 100 396 196" fill="none" stroke="#E31837" stroke-width="36" stroke-linecap="round"/>
  <g fill="none" stroke="url(#blue)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 158 400 L 158 246"/>
    <path d="M 158 246 L 354 400"/>
    <path d="M 354 400 L 354 246"/>
  </g>
  <circle cx="158" cy="246" r="23" fill="#93C5FD"/>
  <circle cx="354" cy="400" r="23" fill="#93C5FD"/>
</svg>
